server:
  port: 8080
spring:
  application:
    name: gateway
  cloud:
    gateway:
      httpclient:
        connect-timeout: 3000
        response-timeout: 10s
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:*"
              - "http://127.0.0.1:*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth
          uri: ${AUTH_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
        - id: farms
          uri: ${FARM_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/farms/**,/api/v1/fields/**,/api/v1/seasons/**
        - id: telemetry
          uri: ${TELEMETRY_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/machines/*/telemetry,/api/v1/machines/*/track
        - id: maintenance
          uri: ${ASSET_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/maintenance/**
        - id: machines
          uri: ${ASSET_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/machines/**
        - id: weather
          uri: ${WEATHER_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/weather/**
        - id: operations
          uri: ${OPERATION_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/operations/**
        - id: inventory
          uri: ${INVENTORY_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/inventory/**
        - id: alerts
          uri: ${ALERT_URL:http://localhost:8088}
          predicates:
            - Path=/api/v1/alerts/**
        - id: ai
          uri: ${AI_URL:http://localhost:8089}
          predicates:
            - Path=/api/v1/ai/**
        - id: notifications
          uri: ${NOTIFICATION_URL:http://localhost:8090}
          predicates:
            - Path=/api/v1/notifications/**
        - id: map
          uri: ${FILE_URL:http://localhost:8091}
          predicates:
            - Path=/api/v1/map/**
        - id: files
          uri: ${FILE_URL:http://localhost:8091}
          predicates:
            - Path=/api/v1/files/**
        - id: reports
          uri: ${REPORTING_URL:http://localhost:8092}
          predicates:
            - Path=/api/v1/reports/**
        - id: sync
          uri: ${SYNC_URL:http://localhost:8093}
          predicates:
            - Path=/api/v1/sync/**
        - id: integration
          uri: ${INTEGRATION_URL:http://localhost:8094}
          predicates:
            - Path=/api/v1/integrations/**
        - id: agronomy-soil
          uri: ${AGRONOMY_URL:http://localhost:8095}
          predicates:
            - Path=/api/v1/soil/**
        - id: agronomy-scouting
          uri: ${AGRONOMY_URL:http://localhost:8095}
          predicates:
            - Path=/api/v1/scouting/**
        - id: agronomy-recommendations
          uri: ${AGRONOMY_URL:http://localhost:8095}
          predicates:
            - Path=/api/v1/recommendations/**
        - id: agronomy-prescriptions
          uri: ${AGRONOMY_URL:http://localhost:8095}
          predicates:
            - Path=/api/v1/prescriptions/**
        - id: irrigation
          uri: ${IRRIGATION_URL:http://localhost:8096}
          predicates:
            - Path=/api/v1/irrigation/**
        - id: harvest
          uri: ${HARVEST_URL:http://localhost:8097}
          predicates:
            - Path=/api/v1/harvest/**
        - id: logistics
          uri: ${HARVEST_URL:http://localhost:8097}
          predicates:
            - Path=/api/v1/logistics/**
        - id: storage
          uri: ${HARVEST_URL:http://localhost:8097}
          predicates:
            - Path=/api/v1/storage/**
        - id: finance
          uri: ${FINANCE_URL:http://localhost:8098}
          predicates:
            - Path=/api/v1/finance/**
        - id: market
          uri: ${FINANCE_URL:http://localhost:8098}
          predicates:
            - Path=/api/v1/market/**
        - id: traceability
          uri: ${COMPLIANCE_URL:http://localhost:8099}
          predicates:
            - Path=/api/v1/traceability/**
        - id: esg
          uri: ${COMPLIANCE_URL:http://localhost:8099}
          predicates:
            - Path=/api/v1/esg/**
        - id: seed-auth
          uri: ${AUTH_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/dev/seed/reset
app:
  security:
    jwt-secret: ${JWT_SECRET:precision-farming-demo-jwt-secret-key-32}
    allow-demo-secrets: ${ALLOW_DEMO_SECRETS:false}
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
