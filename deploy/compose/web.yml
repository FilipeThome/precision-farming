# Local demo Compose overlay for React web (Node Alpine build → nginx Alpine).
# Browser calls host gateway at http://localhost:8080 (build-arg VITE_API_BASE_URL).
# Copy deploy/compose/*.env.example if *.env is missing; stage the pinned Gradle zip; then --build.

name: precision-farming

services:
  web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.web
      args:
        VITE_API_BASE_URL: http://localhost:8080
    image: precision-farming-web:local
    pull_policy: never
    mem_limit: 512m
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - precision-farming

networks:
  precision-farming:
    name: precision-farming