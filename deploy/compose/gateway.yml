# Local demo Compose overlay for API gateway (optimized multi-stage JVM image).
# Publishes only 127.0.0.1:8080 — clients must use the gateway.

name: precision-farming

services:
  gateway:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.gateway
    image: precision-farming-gateway:local
    restart: unless-stopped
    env_file:
      - deploy/compose/demo.env
    environment:
      SERVER_PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - precision-farming

networks:
  precision-farming:
    external: true
    name: precision-farming