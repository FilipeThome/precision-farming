# Local demo Compose overlay for API gateway (optimized multi-stage JVM image).
# Publishes only 127.0.0.1:8080 — clients must use the gateway.
# Usage (repo root):
#   docker compose --project-directory . -f docker-compose.yml -f deploy/compose/gateway.yml \
#     --env-file deploy/compose/demo.env up -d --build

name: precision-farming

services:
  gateway:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.gateway
    image: precision-farming-gateway:local
    restart: unless-stopped
    env_file:
      - deploy/compose/demo.env
    environment:
      SERVER_PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    depends_on:
      auth:
        condition: service_healthy
        required: false
      farm:
        condition: service_healthy
        required: false
    networks:
      - precision-farming

networks:
  precision-farming:
    name: precision-farming
