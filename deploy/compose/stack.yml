# Convenience app overlays with Compose profiles (infra stays in root docker-compose.yml).
# Mobile is intentionally excluded.
#
# Core demo (gateway + auth + farm + web):
#   docker compose -f docker-compose.yml -f deploy/compose/stack.yml --env-file deploy/compose/demo.env --profile core up -d --build
#
# Full backend + web:
#   docker compose -f docker-compose.yml -f deploy/compose/stack.yml --env-file deploy/compose/demo.env --profile all up -d --build
#
# Single service (example):
#   docker compose -f docker-compose.yml -f deploy/compose/stack.yml --env-file deploy/compose/demo.env --profile auth up -d --build

name: precision-farming

x-jvm: &jvm
  restart: unless-stopped
  env_file:
    - deploy/compose/demo.env
  environment: &jvm-env
    DB_PORT: "5432"
    SERVER_PORT: "8080"
  networks:
    - precision-farming

services:
  auth:
    <<: *jvm
    profiles: [auth, core, all]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.jvm
      args:
        GRADLE_PROJECT: :backend:services:auth
        MODULE_DIR: backend/services/auth
    image: precision-farming-auth:local
    environment:
      <<: *jvm-env
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  farm:
