# Local demo Compose overlay for operation-service (optimized multi-stage JVM image).
# Requires root infra: docker compose up -d
# Copy deploy/compose/*.env.example if *.env is missing; stage the pinned Gradle zip; then --build.
# Usage:
#   docker compose -f docker-compose.yml -f deploy/compose/operation.yml --env-file deploy/compose/demo.env up -d --build

name: precision-farming

services:
  operation:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.jvm
      args:
        GRADLE_PROJECT: :backend:services:operation
        MODULE_DIR: backend/services/operation
    image: precision-farming-operation:local
    pull_policy: never
    restart: unless-stopped
    env_file:
      - deploy/compose/demo.env
      - deploy/compose/demo-operation.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      SERVER_PORT: "8080"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 75s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
        required: false
    networks:
      - precision-farming

networks:
  precision-farming:
    name: precision-farming