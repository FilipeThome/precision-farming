name: precision-farming

# Full local stack, ready even when a service is unused.
# Alpine variants where the vendor publishes them.
#
# Infra ports are bound to 127.0.0.1 only (local demo). Production must NOT publish
# Postgres/Timescale/RabbitMQ/Redis/MinIO to any host interface — use private networks.
# Kafka is local-only PLAINTEXT and must not be published in production.

services:
  postgres:
    image: postgis/postgis:16-3.5-alpine
    restart: unless-stopped
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Official entrypoint treats `postgres` as the server command and still runs initdb.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: ${DB_USER:-precision}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-precision}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgis.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-precision}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - precision-farming

  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: ["postgres", "-c", "max_connections=50"]
    environment:
      POSTGRES_USER: ${DB_USER:-precision}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-precision}
      POSTGRES_DB: telemetry_db
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-precision}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - precision-farming

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-precision}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:-precision}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - precision-farming

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - precision-farming

  minio:
    # Docker Hub minio/minio is no longer publicly pullable (source-only). Last official image on Quay.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-precision}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-precisionminio}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    # Static curl is at /usr/bin/curl; ubi-micro has no shell, and `mc ready local` needs an alias.
    healthcheck:
      test: ["CMD", "/usr/bin/curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - precision-farming

  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    restart: unless-stopped
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,EXTERNAL://:9092,INTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - precision-farming

networks:
  precision-farming:
    name: precision-farming

volumes:
  postgres_data:
  timescaledb_data:
  rabbitmq_data:
  redis_data:
  minio_data:
  kafka_data:
  file_data:
